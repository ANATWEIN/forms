<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עורך תבנית Highlights + מסמך</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#F5F5F0;--surface:#fff;--border:#E5E7EB;--text:#1a1a1a;--text2:#6B7280;--text3:#9CA3AF;--accent:#4F46E5;--green:#2D7A4F;--orange:#E8603C;--red:#DC2626;--amber:#D97706;--r:12px;}
body{font-family:'Helvetica Neue',Arial,sans-serif;direction:rtl;background:var(--bg);min-height:100vh;display:flex;}

/* EDITOR */
.ep{width:380px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);height:100vh;overflow-y:auto;display:flex;flex-direction:column;}
.ep-head{padding:14px 18px;border-bottom:1px solid var(--border);background:#FAFAFA;}
.ep-head h2{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px;}
.ep-head p{font-size:11px;color:var(--text3);}
.ep-body{flex:1;padding:14px 18px;display:flex;flex-direction:column;gap:12px;}
.ep-sec>label{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:5px;}
.ep-inp{width:100%;padding:8px 12px;font-size:13px;border:1px solid var(--border);border-radius:var(--r);font-family:inherit;color:var(--text);outline:none;background:#FAFAFA;}
.ep-inp:focus{border-color:var(--accent);background:var(--surface);}
.ep-ta{width:100%;padding:8px 12px;font-size:12px;border:1px solid var(--border);border-radius:var(--r);font-family:inherit;color:var(--text);outline:none;background:#FAFAFA;resize:none;}
.ep-ta:focus{border-color:var(--accent);}
.divider{height:1px;background:var(--border);}
.tog-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.tog-row span{font-size:11px;color:var(--text2);}
.tog{position:relative;display:inline-block;width:30px;height:17px;cursor:pointer;}
.tog input{opacity:0;width:0;height:0;position:absolute;}
.togs{position:absolute;inset:0;border-radius:17px;background:#D1D5DB;transition:.15s;}
.togs:before{content:'';position:absolute;height:11px;width:11px;right:3px;top:3px;background:white;border-radius:50%;transition:.15s;}
.tog input:checked+.togs{background:var(--accent);}
.tog input:checked+.togs:before{transform:translateX(-13px);}

/* HL ITEMS */
.hl-list{display:flex;flex-direction:column;gap:8px;}
.hl-card{background:#FAFAFA;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.hl-card.type-points{border-color:#C7D2FE;}
.hl-card.type-db{border-color:#A7F3D0;}
.hc-head{padding:8px 12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);background:white;}
.hc-type-badge{font-size:10px;padding:2px 8px;border-radius:20px;}
.badge-points{background:#EEF2FF;color:var(--accent);}
.badge-db{background:#ECFDF5;color:var(--green);}
.hc-rm{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:none;cursor:pointer;color:var(--text3);font-size:11px;margin-right:auto;}
.hc-rm:hover{background:#FEE2E2;color:var(--red);}
.hc-body{padding:10px 12px;display:flex;flex-direction:column;gap:6px;}
.hc-body input,.hc-body select,.hc-body textarea{width:100%;padding:6px 10px;font-size:12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;outline:none;background:white;color:var(--text);}
.hc-row{display:flex;gap:5px;}
.hc-row input,.hc-row select{flex:1;}
.point-list{display:flex;flex-direction:column;gap:4px;}
.point-row{display:flex;gap:4px;}
.point-row input{flex:1;padding:5px 9px;font-size:12px;border:1px solid var(--border);border-radius:8px;font-family:inherit;outline:none;background:white;}
.point-rm{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:none;cursor:pointer;color:var(--text3);font-size:11px;}
.point-rm:hover{background:#FEE2E2;color:var(--red);}
.add-point{padding:4px 10px;font-size:11px;border:1px dashed #C7D2FE;border-radius:8px;background:none;color:var(--accent);cursor:pointer;font-family:inherit;}

.add-type-wrap{display:flex;flex-direction:column;gap:5px;}
.add-type-grid{display:none;flex-wrap:wrap;gap:5px;}
.add-type-grid.open{display:flex;}
.at-btn{padding:5px 11px;font-size:11px;border:1px solid var(--border);border-radius:20px;background:white;cursor:pointer;font-family:inherit;color:var(--text2);}
.at-btn:hover{border-color:var(--accent);color:var(--accent);}
.add-btn{width:100%;padding:8px;font-size:12px;border:1.5px dashed #C7D2FE;border-radius:var(--r);background:none;color:var(--accent);cursor:pointer;font-family:inherit;}
.add-btn:hover{background:var(--accent);color:white;border-color:var(--accent);}

.ep-footer{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;}
.btn{flex:1;padding:9px;font-size:12px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:inherit;font-weight:500;}
.btn.primary{background:var(--accent);color:white;border-color:var(--accent);}

/* PREVIEW */
.preview-panel{flex:1;background:var(--bg);padding:24px;overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;}
.phone-wrap{width:375px;background:var(--surface);border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.1);overflow:hidden;display:flex;flex-direction:column;}
.phone-bar{height:40px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;}
.pbar-step{font-size:11px;color:var(--text3);}
.pbar-dots{display:flex;gap:4px;margin-right:auto;}
.pdot{width:6px;height:6px;border-radius:50%;background:var(--border);}
.pdot.active{background:var(--accent);}
.phone-scroll{flex:1;overflow-y:auto;}

/* Highlights */
.pv-hl-section{padding:16px;background:var(--bg);}

/* Points highlights */
.pv-hl-points{background:#FFFBEB;border:1px solid #FCD34D;border-radius:14px;padding:14px 16px;margin-bottom:10px;}
.pv-hl-points-title{font-size:13px;font-weight:700;color:#92400E;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.pv-point-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.06);font-size:13px;color:var(--text);}
.pv-point-row:last-child{border-bottom:none;}
.pv-point-check{width:24px;height:24px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;color:white;font-size:12px;flex-shrink:0;}

/* DB highlights */
.pv-hl-db{background:#F8F8F6;border-radius:14px;padding:4px 0;margin-bottom:10px;border:1px solid var(--border);}
.pv-db-row{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid rgba(0,0,0,.05);font-size:13px;}
.pv-db-row:last-child{border-bottom:none;}
.pv-db-label{color:var(--text2);}
.pv-db-value{font-weight:600;color:var(--text);}

/* Content */
.pv-content{padding:16px;}
.pv-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:3px;}
.pv-sub{font-size:13px;color:var(--text2);margin-bottom:8px;line-height:1.5;}
.pv-time{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;background:#F5F5F0;border-radius:20px;font-size:12px;color:var(--text2);margin-bottom:14px;border:1px solid var(--border);}

/* Doc */
.pv-scroll-hint{background:#FFFBEB;border:1px solid #FCD34D;border-radius:10px;padding:8px 14px;font-size:12px;color:#92400E;margin-bottom:8px;display:flex;gap:6px;align-items:center;}
.pv-doc-btn{width:100%;padding:13px;font-size:14px;border:1.5px solid var(--red);border-radius:12px;background:#FEF2F2;color:var(--red);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;transition:all .2s;}
.pv-doc-btn.opened{border-color:var(--green);background:#F0FDF4;color:var(--green);}
.pv-doc-content{background:#F8F8F6;border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:12px;color:var(--text);line-height:1.9;display:none;max-height:200px;overflow-y:auto;}
.pv-doc-content.show{display:block;}
.pv-scroll-done{font-size:11px;color:var(--green);text-align:left;margin-bottom:6px;display:none;}
.pv-scroll-done.show{display:block;}

/* Confirm */
.pv-confirm{border:1.5px solid var(--green);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:10px;opacity:.4;pointer-events:none;transition:all .15s;}
.pv-confirm.enabled{opacity:1;pointer-events:auto;}
.pv-confirm:hover.enabled{background:#F0FDF4;}
.pv-confirm-check{width:28px;height:28px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;color:white;font-size:14px;flex-shrink:0;}
.pv-confirm-text{font-size:14px;font-weight:500;color:var(--green);}

/* Sig */
.pv-sig{background:#F8F8F6;border-radius:14px;padding:14px;margin-bottom:10px;opacity:.4;pointer-events:none;transition:all .15s;}
.pv-sig.enabled{opacity:1;pointer-events:auto;}
.pv-sig-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px;}
.pv-sig-sub{font-size:12px;color:var(--text3);margin-bottom:8px;}
.sig-canvas{width:100%;height:90px;cursor:crosshair;display:block;border:1px solid var(--border);border-radius:8px;background:white;}

.phone-footer{padding:12px 16px 20px;border-top:1px solid var(--border);}
.pv-action-btn{width:100%;padding:15px;font-size:15px;font-weight:600;border-radius:50px;border:none;background:var(--orange);color:white;cursor:pointer;font-family:inherit;margin-bottom:10px;}
.pv-back{display:block;text-align:center;font-size:13px;color:var(--text3);cursor:pointer;}

/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-box{background:white;border-radius:14px;padding:22px 24px;width:340px;box-shadow:0 20px 50px rgba(0,0,0,.15);}
.modal-box h3{font-size:14px;font-weight:600;margin-bottom:12px;}
.modal-inp{width:100%;padding:8px 12px;font-size:13px;border:1px solid var(--border);border-radius:10px;font-family:inherit;outline:none;margin-bottom:12px;}
.modal-btns{display:flex;gap:8px;}
.m-cancel{flex:1;padding:8px;font-size:13px;border-radius:10px;border:1px solid var(--border);background:none;cursor:pointer;font-family:inherit;}
.m-ok{flex:1;padding:8px;font-size:13px;border-radius:10px;border:none;background:var(--accent);color:white;cursor:pointer;font-family:inherit;font-weight:500;}
.saved-list{max-height:200px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:5px;}
.saved-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;}
.si-load{padding:3px 10px;font-size:11px;border-radius:20px;border:none;background:var(--accent);color:white;cursor:pointer;}
.si-del{padding:3px 8px;font-size:11px;border-radius:20px;border:1px solid #FECACA;background:#FEF2F2;color:var(--red);cursor:pointer;}

.toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);background:#111;color:white;font-size:12px;padding:7px 18px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;}
.pv-doc-full{display:block !important;max-height:260px !important;overflow-y:auto;white-space:normal;font-size:13px;line-height:1.75;color:#374151;background:#FAFAF8;border:1px solid #EEE;border-radius:12px;padding:14px 16px;margin-top:12px}
.pv-hl-info{display:flex;gap:8px;align-items:flex-start;background:#FEF3C7;border:1px solid #FCD34D;color:#92400E;border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.6;margin-top:10px}.pv-hl-info-i{flex:none}
</style>
<script>
/* ═══════════════════════════════════════════════════════════════
   synel-db.js — רשימת שדות ה-DB של הרמוני ובורר שדה DB אחיד
   כל בחירת שדה DB בתבניות היא בחירה מהרשימה הזו (לא הקלדה חופשית).
   ═══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  // dbField · labelHe · category · type (text | currency | days | date | date_calc | percent | bool)
  var FIELDS = [
    { dbField: 'EMP_NAME', labelHe: 'שם מלא', category: 'פרטי עובד', type: 'text' },
    { dbField: 'EMP_FIRST_NAME', labelHe: 'שם פרטי', category: 'פרטי עובד', type: 'text' },
    { dbField: 'TZ', labelHe: 'תעודת זהות', category: 'פרטי עובד', type: 'text' },
    { dbField: 'EMP_DATE_START', labelHe: 'תאריך תחילת עבודה', category: 'פרטי עובד', type: 'date' },
    { dbField: 'EMP_DEPARTMENT_DESCR', labelHe: 'מחלקה', category: 'פרטי עובד', type: 'text' },
    { dbField: 'EMP_JOB_DESCR', labelHe: 'תיאור תפקיד', category: 'תפקיד', type: 'text' },
    { dbField: 'job_title', labelHe: 'תפקיד', category: 'תפקיד', type: 'text' },
    { dbField: 'MNG_NAME', labelHe: 'שם מנהל/ת ישיר/ה', category: 'תפקיד', type: 'text' },
    { dbField: 'work_hours', labelHe: 'שעות עבודה', category: 'תפקיד', type: 'text' },
    { dbField: 'monthly_salary', labelHe: 'שכר חודשי', category: 'שכר ותנאים', type: 'currency' },
    { dbField: 'last_gross', labelHe: 'ברוטו חודש אחרון', category: 'שכר ותנאים', type: 'currency' },
    { dbField: 'benefits', labelHe: 'תנאים סוציאליים', category: 'שכר ותנאים', type: 'text' },
    { dbField: 'severance', labelHe: 'פיצויי פיטורין', category: 'שכר ותנאים', type: 'currency' },
    { dbField: 'vacation_days', labelHe: 'יתרת ימי חופשה', category: 'היעדרויות', type: 'days' },
    { dbField: 'sick_days', labelHe: 'יתרת ימי מחלה', category: 'היעדרויות', type: 'days' },
    { dbField: 'termination_date', labelHe: 'תאריך פרישה', category: 'פרישה', type: 'date' },
    { dbField: 'pension_release_date', labelHe: 'מועד שחרור פנסיה/קופות', category: 'פרישה', type: 'date_calc' },
    { dbField: 'Equip.Status', labelHe: 'סטטוס ציוד', category: 'ציוד', type: 'text' }
  ];

  var MAP = {};
  FIELDS.forEach(function (f) { MAP[f.dbField] = f; });
  window.SYNEL_DB_FIELDS = FIELDS;
  window.SYNEL_DB_MAP = MAP;

  // בורר שדה DB: רשימה נפתחת מקובצת לפי קטגוריה
  window.buildDBDropdown = function (value, onChange) {
    var sel = document.createElement('select');
    sel.className = 'synel-db-select';
    sel.style.cssText = 'width:100%;padding:5px 8px;font-size:12px;border:1px solid #C7D2FE;border-radius:6px;background:#EEF2FF;color:#4338CA;font-family:inherit;';
    var empty = document.createElement('option'); empty.value = ''; empty.textContent = '— בחירת שדה DB —'; sel.appendChild(empty);
    var cats = {};
    FIELDS.forEach(function (f) { (cats[f.category] = cats[f.category] || []).push(f); });
    Object.keys(cats).forEach(function (c) {
      var og = document.createElement('optgroup'); og.label = c;
      cats[c].forEach(function (f) {
        var o = document.createElement('option'); o.value = f.dbField; o.textContent = f.labelHe + ' — ' + f.dbField;
        if (f.dbField === value) o.selected = true;
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
    if (value && !MAP[value]) { var x = document.createElement('option'); x.value = value; x.textContent = value; x.selected = true; sel.appendChild(x); }
    sel.addEventListener('change', function () { if (onChange) onChange(sel.value, MAP[sel.value] || null); });
    return sel;
  };

  // מי ממלא את השדה
  var FILLERS = [['E_', 'עובד'], ['M_', 'מנהל'], ['S_', 'מנהל על'], ['A_', 'כולם']];
  window.buildFillerSelect = function (value, onChange) {
    var sel = document.createElement('select');
    sel.style.cssText = 'padding:5px 8px;font-size:12px;border:1px solid #E5E7EB;border-radius:6px;font-family:inherit;';
    FILLERS.forEach(function (f) { var o = document.createElement('option'); o.value = f[0]; o.textContent = f[1]; if (f[0] === value) o.selected = true; sel.appendChild(o); });
    sel.addEventListener('change', function () { if (onChange) onChange(sel.value); });
    return sel;
  };
})();

</script>
<script>window.SYNEL_PAGE='template-highlights';window.SYNEL_INLINE=true;</script>
<script>
/* ═══════════════════════════════════════════════════════════════
   synel-shell.js — הרכיבים הקבועים של כל התבניות המוכנות
   אותם רכיבים, אותו מקום, בכל תבנית. החלק הייחודי של כל תבנית לא משתנה.

   עורך:   למעלה "פרטי הטופס" · באמצע התוכן הייחודי · למטה "סיום ותהליך" · פוטר
   מילוי:  למעלה חזרה + שלב + התקדמות · כותרת · תוכן ייחודי · אישורים + כפתור + קישורים
   ═══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  // תבניות שנטענות בלי קובצי העזר החיצוניים — כדי שהתצוגה לא תישבר
  // רשימת שדות ה-DB נטענת לפני קוד התבנית, כדי שכל בחירת שדה DB תהיה מרשימה
  if (typeof window.buildDBDropdown === 'undefined' && document.readyState === 'loading' && !window.SYNEL_INLINE) document.write('<script src="synel-db.js?v=1"><\/script>');
  if (typeof window.SYNEL_DB_FIELDS === 'undefined') window.SYNEL_DB_FIELDS = [];
  if (typeof window.updateConfirmType === 'undefined') window.updateConfirmType = function () { };

  var PAGE = window.SYNEL_PAGE || (location.pathname.split('/').pop() || '').replace('.html', '');

  /* ── הגדרות לכל תבנית: איפה השדות הקבועים הישנים, ומה להסתיר ── */
  var CFG = {
    'template-questionnaire': {
      ids: { name: 'fName', icon: 'fNameIcon', sub: 'fSub', time: 'fTime', btn: 'fBtn', stepCur: 'fStepCur', stepTotal: 'fStepTotal' },
      hideSec: ['fName', 'fSub', 'fTime', 'fBtn', 'fProcess', 'fStepCur', 'fOwner', 'fRoles', 'tSig'],
      off: function () { if (window.fm && fm.confirm && (fm.confirm.signature || fm.confirm.checkbox)) { fm.confirm.signature = false; fm.confirm.checkbox = false; if (typeof window.render === 'function') window.render(); } },
      header: '.form-title,.form-subtitle,.time-badge',
      content: '#phoneContent',
      examples: [{ label: 'החזרת ציוד', reset: true }, { label: 'סקר שביעות רצון', name: 'סקר שביעות רצון — חודש ראשון' }, { label: 'בקשת מכתב המלצה', name: 'בקשת מכתב המלצה' }],
      get: function () { return JSON.parse(JSON.stringify(window.fm)); },
      set: function (d) { window.loadForm(d); }
    },
    'template-list': {
      ids: { name: 'fName', sub: 'fSub', time: 'fTime', stepCur: 'fStepCur', stepTotal: 'fStepTotal' },
      hideSec: ['fName', 'fSub', 'fTime', 'fProcess', 'hasRC'],
      offIds: ['hasRC', 'hasSig'],
      header: '.pv-title,.pv-sub,.pv-time',
      content: '#pvContent',
      get: function () { return window.getData(); },
      set: function (d) { window.loadForm(d); }
    },
    'template-info-db': {
      ids: { name: 'fName', icon: 'fIcon', sub: 'fSub', time: 'fTime', btn: 'fBtn', stepCur: 'fStepCur', stepTotal: 'fStepTotal' },
      hideSec: ['fName', 'fSub', 'fTime', 'fBtn', 'fProcess', 'fOwner', 'hasReadConfirm', 'hasSigOpt'],
      hideRow: ['fStepCur', 'assignSummary'],
      hideParent: ['fStepCur'],
      offIds: ['hasReadConfirm', 'hasSignature', 'hasDocBtn', 'hasSigOpt', 'hasCheckOpt'],
      header: '.pv-title,.pv-sub,.pv-time,.ph-title,.ph-sub,.ph-time,.form-title,.form-sub,.time-badge',
      content: '#phoneContent',
      fullDoc: true,
      get: function () { return window.getData(); },
      set: function (d) { window.loadForm(d); }
    },
    'template-highlights': {
      ids: { name: 'fName', sub: 'fSub', time: 'fTime', btn: 'fBtn', stepCur: 'fStepCur', stepTotal: 'fStepTotal' },
      hideSec: ['fName', 'fSub', 'fTime', 'fBtn', 'fProcess', 'fOwner', 'hasRC'],
      offIds: ['hasRC', 'hasSig'],
      header: '.pv-title,.pv-sub,.pv-time',
      content: '#phoneScroll',
      fullDoc: true,

    var oldFoot = phone.querySelector('.phone-footer');
    pfoot = document.createElement('div'); pfoot.className = 'sh-pfoot';
    var action = $('actionBtn');
    if (oldFoot && !cfg.flow) { oldFoot.classList.add('sh-hide'); oldFoot.parentElement.insertBefore(pfoot, oldFoot.nextSibling); }
    else phone.appendChild(pfoot);
    // בתבניות זרימה ההתקדמות הקבועה מחליפה את פס ההתקדמות הפנימי
    phone.querySelectorAll('.flow-screen .progress-bar').forEach(function (e) { e.classList.add('sh-hide'); });
    pfoot.innerHTML = '<div data-z="doc"></div><div data-z="cons"></div><div data-z="sig"></div><div data-z="btn"></div><div class="sh-links" data-z="links"></div>';
    if (action && !cfg.flow) pfoot.querySelector('[data-z="btn"]').appendChild(action);
  }
  function renderPreview() {
    if (!bar) return;
    var ph = document.querySelector('.phone-wrap') || document.querySelector('.phone');
    var c = S.brand || '#E95B19';
    if (ph) { ph.style.setProperty('--sh-brand', c); ph.style.setProperty('--orange', c); ph.style.setProperty('--accent', c); }
    var cur = Math.max(1, parseInt(S.stepCur, 10) || 1), tot = Math.max(cur, parseInt(S.stepTotal, 10) || 1);
    bar.innerHTML =
      (S.back ? '<button type="button" class="sh-back" aria-label="חזרה">→</button>' : '')
      + '<span class="sh-step">שלב ' + cur + ' מתוך ' + tot + '</span>'
      + (S.progress ? '<div class="sh-prog"><b style="width:' + Math.round(cur / tot * 100) + '%"></b></div>' : '');

    head.innerHTML =
      '<h1>' + (S.icon ? esc(S.icon) + ' ' : '') + esc(S.name || 'שם הטופס') + '</h1>'
      + (S.sub ? '<p>' + esc(S.sub) + '</p>' : '')
      + (S.time ? '<span class="sh-chip">⏱ זמן משוער: ~' + esc(S.time) + ' דק\'</span>' : '');

    var z = function (n) { return pfoot.querySelector('[data-z="' + n + '"]'); };
    var gate = !!(cfg.fullDoc && S.fullDoc);
    var done = !gate || readDone();
    if (done) docWarn = false;
    z('doc').innerHTML = '';
    docIndicator(gate, done);
    z('cons').innerHTML = (!cfg.own && S.consent) ? '<label class="sh-cons"><input type="checkbox"> ' + esc(S.consentText || 'קראתי והבנתי') + '</label>' : '';
    z('sig').innerHTML = (!cfg.own && S.sig) ? '<div class="sh-sigbox">✍️ חתימה דיגיטלית — לחצו כדי לחתום</div>' : '';
    z('links').innerHTML =
      (S.later ? '<button type="button" class="sh-link">המשך מאוחר יותר</button>' : '')
      + (S.backList ? '<button type="button" class="sh-link">חזרה לרשימה</button>' : '');

    var a = $('actionBtn'); if (a && !cfg.flow && S.btn) a.textContent = S.btn;
    if (a && !cfg.flow) { a.classList.toggle('sh-locked', !done); if (!a._shGate) { a._shGate = true; a.addEventListener('click', gateClick, true); } }
    var cb = pfoot.querySelector('.sh-cons input'); if (cb && !cb._shGate) { cb._shGate = true; cb.addEventListener('click', gateClick, true); }
    if (cfg.gateSel && !document._shGateSel) { document._shGateSel = true; document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest(cfg.gateSel)) gateClick(e); }, true); }
    if (cfg.flowBtn && S.btn) {
      var fb = document.querySelectorAll(cfg.flowBtn); if (fb.length) fb[fb.length - 1].textContent = S.btn;
    }
    // תגיות זמן שקבועות בתוך תוכן התבנית
    var phone = document.querySelector('.phone-wrap') || document.querySelector('.phone');
    if (phone) phone.querySelectorAll('div,span').forEach(function (el) {
      if (el.children.length === 0 && /^\s*⏱\s*זמן משוער/.test(el.textContent) && !el.classList.contains('sh-chip')) el.classList.add('sh-hide');
    });
    // כפילויות של רכיבים קבועים בתוך תוכן התבנית (חזרה לרשימה, כותרת משנה)
    if (phone) phone.querySelectorAll('div,span,a,button,p').forEach(function (el) {
      if (el.closest('.sh-bar,.sh-head,.sh-pfoot') || el.children.length) return;
      var t = el.textContent.trim();
      if (t === 'חזרה לרשימה' || (S.sub && t === S.sub.trim())) el.classList.add('sh-hide');
    });
  }
  // קריאה מלאה: העובד גלל עד סוף התוכן (בתוך אזור גלילה פנימי, או בגלילת המסך)
  var readLatch = false;
  function readDone() {
    if (readLatch) return true;
    var box = cfg.docBox && document.querySelector(cfg.docBox);
    if (box) {
      if (!box._shBound) { box._shBound = true; box.addEventListener('scroll', function () { later(); }); }
      var okb = box.scrollHeight <= box.clientHeight + 4 || box.scrollTop + box.clientHeight >= box.scrollHeight - 4;
      if (okb) { readLatch = true; box.classList.remove('sh-doc-warn'); }
      return okb;
    }
    var sc = scroller(), ok;
    var ov = sc && (function (o) { return o === 'auto' || o === 'scroll'; })(getComputedStyle(sc).overflowY) && sc.scrollHeight > sc.clientHeight + 4;
    if (ov) {
      if (!sc._shBound) { sc._shBound = true; sc.addEventListener('scroll', function () { later(); }); }
      ok = sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 4;
    } else {
      var el = sc || head; ok = !el || el.getBoundingClientRect().bottom <= window.innerHeight + 4;
    }
    if (ok) readLatch = true;
    return ok;
  }
  window.addEventListener('scroll', function () { if (!readLatch) later(); }, { passive: true });
  // חיווי קריאה בתוך המסמך: לפני הסוף — "יש לגלול עד הסוף"; בסוף — "הגעת לסוף המסמך"
  function docIndicator(gate, done) {
    var box = cfg.docBox && document.querySelector(cfg.docBox);
    var host = box || scroller();
    document.querySelectorAll('.sh-docind').forEach(function (e) { if (!host || e.parentElement !== (box ? box : host.parentElement)) e.remove(); });
    if (!gate || !host) return;
    // בלי תיבת מסמך (התוכן הוא חלק מהטופס) — אין חיווי קבוע; רק אזהרה בניסיון להמשיך לפני הסוף
    if (!box && (done || !docWarn)) { document.querySelectorAll('.sh-docind').forEach(function (e) { e.remove(); }); return; }
    var el = (box ? box : host.parentElement).querySelector(':scope > .sh-docind');
    if (!el) { el = document.createElement('div'); el.className = 'sh-docind'; if (box) box.appendChild(el); else host.parentElement.insertBefore(el, host.nextSibling); }
    el.className = 'sh-docind' + (done ? ' ok' : docWarn ? ' bad' : '') + (box ? ' inbox' : '');
    el.textContent = done ? '✓ הגעת לסוף המסמך' : docWarn ? '⚠️ יש לקרוא את המסמך עד הסוף לפני שממשיכים' : '↓ יש לגלול עד סוף המסמך';
  }
  // ניסיון להמשיך לפני קריאה מלאה: חוסם ומציג חיווי
  var docWarn = false;
  function gateClick(e) {
    if (!(cfg.fullDoc && S.fullDoc) || readDone()) return;
    e.preventDefault(); e.stopImmediatePropagation();
    docWarn = true;
    var box = cfg.docBox && document.querySelector(cfg.docBox);
    if (box) { box.classList.add('sh-doc-warn'); box.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    renderPreview();
  }
  // אזור הגלילה של התוכן בתצוגת המילוי
  function scroller() {
    var ph = document.querySelector('.phone-wrap') || document.querySelector('.phone'); if (!ph) return null;
    var c = ['#phoneScroll', '#phoneContent', '#pvContent', '.phone-scroll'].map(function (q) { return ph.querySelector(q); }).filter(Boolean);
    for (var i = 0; i < c.length; i++) { var o = getComputedStyle(c[i]).overflowY; if (o === 'auto' || o === 'scroll') return c[i]; }
    var p = c[0]; while (p && p !== ph) { var oy = getComputedStyle(p).overflowY; if (oy === 'auto' || oy === 'scroll') return p; p = p.parentElement; }
    return c[0] || null;
  }
  var tmr; function later() { clearTimeout(tmr); tmr = setTimeout(function () { silenceOld(); renderPreview(); }, 30); }

  /* ── שמירה / שמור בשם / טפסים שמורים / פרסום ── */
  function toast(m) {
    var t = document.createElement('div'); t.className = 'sh-toast'; t.textContent = m; document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 1800);
  }
  function snapshot() { var tpl = null; try { tpl = cfg.get(); } catch (e) { } S.savedAt = new Date().toISOString(); return { tpl: tpl, shell: JSON.parse(JSON.stringify(S)), savedAt: S.savedAt }; }
  function save() {
    if (!S.name) { toast('צריך לתת שם לטופס'); return; }
    localStorage.setItem(STORE + S.name, JSON.stringify(snapshot())); toast('נשמר ✓');
  }
  function modal(html) {
    var ov = document.createElement('div'); ov.className = 'sh-ov';
    ov.innerHTML = '<div class="sh-modal">' + html + '</div>';
    ov.addEventListener('click', function (e) { if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov); return ov;
  }
  function saveAs() {
    var ov = modal('<h3>📋 שמור בשם</h3><input class="sh-in" placeholder="שם הטופס החדש"><div class="sh-row" style="justify-content:flex-end"><button type="button" class="sh-fb" data-x>ביטול</button><button type="button" class="sh-fb sh-pub" style="grid-column:auto" data-ok>שמירה</button></div>');
    var inp = ov.querySelector('input'); inp.value = (S.name || '') + ' — עותק'; setTimeout(function () { inp.select(); }, 30);
    var ok = function () {
      var n = inp.value.trim(); if (!n) return;
      S.name = n; fillEditor(); push(); later();
      localStorage.setItem(STORE + n, JSON.stringify(snapshot())); ov.remove(); toast('נשמר בשם "' + n + '" ✓');
    };
    ov.querySelector('[data-ok]').onclick = ok; ov.querySelector('[data-x]').onclick = function () { ov.remove(); };
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') ok(); });
  }
  function openSaved() {
    var names = [];
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k.indexOf(STORE) === 0) names.push(k.slice(STORE.length)); }
    var ov = modal('<h3>📂 טפסים שמורים</h3><div class="sh-list" style="display:flex;flex-direction:column;gap:6px"></div><button type="button" class="sh-fb" data-x>סגירה</button>');
    var list = ov.querySelector('.sh-list');
    if (!names.length) list.innerHTML = '<span class="sh-mini">אין עדיין טפסים שמורים בתבנית הזו.</span>';
    names.sort().forEach(function (n) {
      var row = document.createElement('div'); row.className = 'sh-item';
      row.innerHTML = '<span>' + esc(n) + '</span><button type="button" class="sh-fb">טעינה</button><button type="button" class="sh-fb">מחיקה</button>';
      row.children[1].onclick = function () { load(n); ov.remove(); };
      row.children[2].onclick = function () { localStorage.removeItem(STORE + n); row.remove(); };
      list.appendChild(row);
    });
    ov.querySelector('[data-x]').onclick = function () { ov.remove(); };
  }
  function load(n) {
    var raw = localStorage.getItem(STORE + n); if (!raw) return;
    try {
      var d = JSON.parse(raw);
      if (d.tpl) { try { cfg.set(d.tpl); } catch (e) { } }
      Object.assign(S, d.shell || {});
      fillEditor(); push(); hideOld(); later(); toast('נטען: ' + n);
    } catch (e) { toast('שגיאה בטעינה'); }
  }
  function publish() {
    if (!S.name) { toast('צריך לתת שם לטופס'); return; }
    save(); toast('"' + S.name + '" פורסם בהרמוני ✓');
  }

  /* ── הפעלה ── */
  function init() {
    pull();
    if (cfg.defaults) Object.keys(cfg.defaults).forEach(function (k) { if (!S[k]) S[k] = cfg.defaults[k]; });
    if (cfg.own) {
      var c = $(cfg.own.consent), t = $(cfg.own.consentText), g = $(cfg.own.sig);
      if (c) S.consent = c.checked; if (t && t.value) S.consentText = t.value; if (g) S.sig = g.checked;
    } else {
      // ערכי האישורים הישנים עוברים לרכיבים הקבועים
      var oc = ['hasRC', 'hasReadConfirm', 'hasCheckOpt'].map($).filter(Boolean)[0];
      var ot = ['rcText', 'readConfirmText', 'confirmOptText'].map($).filter(Boolean)[0];
      var os = ['hasSig', 'hasSignature', 'hasSigOpt'].map($).filter(Boolean)[0];
      if (PAGE === 'template-questionnaire' && window.fm && fm.confirm) { S.consent = !!fm.confirm.checkbox; S.sig = !!fm.confirm.signature; if (fm.confirm.checkboxText) S.consentText = fm.confirm.checkboxText; }
      else { if (oc) S.consent = oc.checked; if (ot && ot.value) S.consentText = ot.value; if (os) S.sig = os.checked; }
      if ($('hasDocBtn')) S.fullDoc = $('hasDocBtn').checked;
    }
    if (!S.icon && cfg.ids && !cfg.ids.icon) S.icon = { 'template-list': '📋', 'template-highlights': '⭐', 'template-pension': '💰' }[PAGE] || '';
    hideOld();
    buildEditor();
    buildPreview();
    push(); silenceOld();
    var panel = document.querySelector('.editor-panel,.ep');
    if (panel) { panel.addEventListener('input', later); panel.addEventListener('change', later); panel.addEventListener('click', later); }
    document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('.phone-wrap,.phone')) later(); });
    renderPreview(); later();
    // פתיחה מתוך "שמורים" בגלריה
    var q = new URLSearchParams(location.search).get('sh'); if (q) load(q);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(init, 0); });
  else setTimeout(init, 0);
})();

</script>
</head>
<body>

<div class="ep">
  <div class="ep-head">
    <h2>⭐ עורך תבנית Highlights + מסמך</h2>
    <p>שורות DB · נקודות טקסט · בועית מידע · מסמך לחתימה</p>
  </div>
  <div class="ep-body">

    <div class="ep-sec">
      <label>שם הטופס</label>
      <input class="ep-inp" id="fName" value="חוזה ההעסקה שלך" oninput="render()">
    </div>
    <div class="ep-sec">
      <label>תת-כותרת</label>

    <div class="ep-sec">
      <label>זמן משוער (דקות)</label>
      <input class="ep-inp" id="fTime" value="3" style="width:80px;" oninput="render()">

    <div class="divider"></div>

    <!-- HIGHLIGHTS -->

      <label>סעיפי Highlights</label>
      <div class="hl-list" id="hlList"></div>
      <div class="add-type-wrap">
        <div class="add-type-grid" id="addGrid">
          <button class="at-btn" onclick="addHL('db')">🗄 שורות DB</button>
          <button class="at-btn" onclick="addHL('points')">✓ נקודות טקסט</button>
          <button class="at-btn" onclick="addHL('info')">ℹ️ בועית מידע</button>
        </div>
        <button class="add-btn" onclick="document.getElementById('addGrid').classList.toggle('open')">+ הוסף סעיף Highlights</button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- DOC -->
    <div class="ep-sec">
      <label>תוכן המסמך</label>
      <textarea class="ep-ta" id="docContent" rows="10" placeholder="הדביקו כאן את המסמך המלא..." oninput="render()"></textarea>
      <input type="checkbox" id="hasDoc" checked hidden><input id="docBtnText" hidden value=""><input type="checkbox" id="docRequired" hidden><input type="checkbox" id="hasDocContent" checked hidden>
    </div>

    <div class="divider"></div>

    <!-- CONFIRM -->
    <div class="ep-sec">
      <label>אישור וחתימה</label>
      <div class="tog-row">
        <span>אישור קריאה</span>
        <label class="tog"><input type="checkbox" id="hasRC" checked onchange="render()"><span class="togs"></span></label>
      </div>
      <input class="ep-inp" id="rcText" value="קראתי והבנתי את המסמך המלא" oninput="render()" style="margin-bottom:6px;">

      </div>
    </div>

    <div class="divider"></div>

    <div class="ep-sec">
      <label>כפתור פעולה</label>
      <input class="ep-inp" id="fBtn" value="אישור והמשך ←" oninput="render()">
    </div>
    <div class="ep-sec">
      <label>שיוך</label>
      <select class="ep-inp" id="fProcess" onchange="updateAssign()">
        <option value="">— תהליך —</option>
        <option value="onboarding" selected>🚀 Onboarding</option>
        <option value="offboarding">🚪 Offboarding</option>
        <option value="lifecycle">🔄 Life Cycle</option>
      </select>
      <div style="display:flex;gap:6px;align-items:center;margin-top:6px;">
        <label style="font-size:11px;color:var(--text2);">שלב</label>
        <input class="ep-inp" id="fStepCur" type="number" value="2" style="width:55px;" oninput="updateAssign()">
        <span style="font-size:12px;color:var(--text3);">מתוך</span>
        <input class="ep-inp" id="fStepTotal" type="number" value="6" style="width:55px;" oninput="updateAssign()">
      </div>
      <select class="ep-inp" id="fOwner" style="margin-top:6px;">
        <option value="">— עובד אחראי —</option>
        <option>HR</option><option>מנהל ישיר</option><option>IT</option><option>חשב שכר</option>
      </select>
    </div>

  </div>
  <div class="ep-footer">
    <button class="btn" onclick="saveForm()">💾 שמור</button>
    <button class="btn" onclick="saveAs()">📋 שמור בשם</button>
    <button class="btn" style="width:100%;background:#1e1b4b;color:white;border-color:#1e1b4b;" onclick="exportJSON()">{ } ייצא JSON</button>
    <button class="btn" style="width:100%;font-size:11px;" onclick="openLoad()">📂 טפסים שמורים</button>
  </div>
</div>

<div class="preview-panel">
  <div class="phone-wrap">
    <div class="phone-bar">
      <span class="pbar-step" id="stepLbl">שלב 2 מתוך 6</span>
      <div class="pbar-dots" id="pbarDots"></div>
    </div>
    <div class="phone-scroll" id="phoneScroll">
      <div class="pv-hl-section" id="hlSection"></div>
      <div class="pv-content" id="pvContent"></div>
    </div>
    <div class="phone-footer">
      <button class="pv-action-btn" id="actionBtn">אישור והמשך ←</button>
      <span class="pv-back">חזרה לרשימה</span>
    </div>
  </div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="saveAsModal" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal-box"><h3>📋 שמור בשם</h3>
    <input class="modal-inp" id="saveAsName" onkeydown="if(event.key==='Enter')confirmSaveAs()">
    <div class="modal-btns"><button class="m-cancel" onclick="document.getElementById('saveAsModal').style.display='none'">ביטול</button><button class="m-ok" onclick="confirmSaveAs()">שמור ✓</button></div>
  </div>
</div>
<div class="modal-overlay" id="loadModal" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal-box" style="width:400px;"><h3>📂 טפסים שמורים</h3>
    <div class="saved-list" id="savedList"></div>
    <button class="m-cancel" style="width:100%;" onclick="document.getElementById('loadModal').style.display='none'">סגור</button>
  </div>
</div>
<div class="toast" id="toastEl"></div>

<script>
var hlSections = [
  {
    type: 'db',
    title: '',
    rows: [
      {label:'תפקיד',           value:'מנהל/ת תפעול',        dbField:'job_title',      type:'text'},
      {label:'שכר חודשי',       value:'14,500',               dbField:'monthly_salary', type:'currency'},
      {label:'שעות עבודה',      value:'186 שעות/חודש, גמיש', dbField:'work_hours',     type:'text'},
      {label:'ימי חופשה',       value:'14 ימים בשנה',        dbField:'vacation_days',  type:'text'},
      {label:'תנאים סוציאליים', value:'פנסיה, קרן השתלמות',  dbField:'benefits',       type:'text'},
    ]

      clr.onclick=function(){ctx.clearRect(0,0,canvas.width,canvas.height);done.style.display='none';};

function exportJSON(){

    meta: {
      name: d.name, subtitle: d.sub||'',
      estimatedTime: parseInt(d.time)||3,
      process: d.process||'', stepCurrent: parseInt(d.stepCur)||1,

    },
    document: {
      hasDoc: d.hasDoc||false,
      docButtonText: d.docBtnText||'',
      docRequired: d.docRequired||false,
      hasDocContent: d.hasDocContent||false,
      docContent: d.docContent||'',
    },
    completion: {
      hasReadConfirm: d.hasRC||false,
      readConfirmText: d.rcText||'',
      hasSignature: d.hasSig||false,
      actionButton: d.btn||'',
    },
    highlights: (d.hlSections||[]).map(function(sec){

        return { type:'db', rows:(sec.rows||[]).map(function(r){
          return { label:r.label, value:r.value||'', dbField:r.dbField||'', filler:r.filler||'', type:r.type||'text' };
        })};

  var blob=new Blob([JSON.stringify(json,null,2)],{type:'application/json'});

}
